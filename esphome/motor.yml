substitutions:
  OPEN_DURATION: 40s
  CLOSE_DURATION: 50s
  INTERNAL_CURRENT_SENSOR: true
  # Time after switching on during which the current is ignored (inrush spike)
  INRUSH_BLANKING_MS: "800"
  # How long the threshold must be exceeded continuously before the endstop triggers
  STALL_CONFIRM: 300ms

globals:
  - id: ${ID_PREFIX}_start_ms
    type: uint32_t
    initial_value: '0'

switch:
  - platform: gpio
    id: ${ID_PREFIX}_close
    name: "${NAME} Close"
    pin:
      sn74hc595: ${SHIFTREG_ID}
      number: ${PIN_CLOSE_NO}
      inverted: false
    internal: true
    interlock:
      - ${ID_PREFIX}_open
  - platform: gpio
    id: ${ID_PREFIX}_open
    name: "${NAME} Open"
    pin:
      sn74hc595: ${SHIFTREG_ID}
      number: ${PIN_OPEN_NO}
      inverted: false
    internal: true
    interlock:
      - ${ID_PREFIX}_close

sensor:
  - platform: adc
    pin: ${PIN_ADC}
    internal: ${INTERNAL_CURRENT_SENSOR}
    name: "${NAME} Current"
    id: ${ID_PREFIX}_current
    update_interval: 1ms
    # 12db: linear up to ~2.45 V (≈ 4.8 A after multiply). 0db would clip at ~1.06 V (≈ 2.08 A).
    # The sensor reports volts regardless of attenuation, so multiply stays the same.
    attenuation: 12db
    filters:
      - multiply: 1.96078
      - sliding_window_moving_average:
          window_size: 15
          send_every: 15
    unit_of_measurement: 'A'

  # Diagnostics: peak current per ~300 ms window to see inrush, running and stall current
  - platform: copy
    source_id: ${ID_PREFIX}_current
    id: ${ID_PREFIX}_current_peak
    name: "${NAME} Current Peak"
    internal: ${INTERNAL_CURRENT_SENSOR}
    unit_of_measurement: 'A'
    filters:
      - max:
          window_size: 20
          send_every: 20

binary_sensor:
  - platform: template
    id: ${ID_PREFIX}_end_cond
    internal: true
    lambda: |-
      if (millis() - id(${ID_PREFIX}_start_ms) < ${INRUSH_BLANKING_MS}) return false;
      return id(${ID_PREFIX}_current).state > ${CURRENT_THRESHOLD};
    filters:
      - delayed_on: ${STALL_CONFIRM}

cover:
  - platform: endstop
    name: "${NAME}"
    open_action:
      - lambda: id(${ID_PREFIX}_start_ms) = millis();
      - switch.turn_off: ${ID_PREFIX}_close
      - switch.turn_on: ${ID_PREFIX}_open
    open_duration: ${OPEN_DURATION}
    open_endstop: ${ID_PREFIX}_end_cond
    close_action:
      - lambda: id(${ID_PREFIX}_start_ms) = millis();
      - switch.turn_off: ${ID_PREFIX}_open
      - switch.turn_on: ${ID_PREFIX}_close
    close_duration: ${CLOSE_DURATION}
    close_endstop: ${ID_PREFIX}_end_cond
    stop_action:
      - switch.turn_off: ${ID_PREFIX}_open
      - switch.turn_off: ${ID_PREFIX}_close
    max_duration: 60s
    entity_category: diagnostic
    id: ${ID_PREFIX}_cover
